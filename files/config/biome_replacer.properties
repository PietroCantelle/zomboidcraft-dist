# ZomboidCraft - Biome Replacer (formato: bioma_antigo > bioma_novo)
# Vulcoes do Terralith nao combinam com Itavera (e chegaram a cair dentro do Centro): viram montanhas de pedra.
terralith:volcanic_peaks > minecraft:stony_peaks
terralith:volcanic_crater > minecraft:stony_peaks
terralith:volcanic > minecraft:stony_peaks
# 0.3.3: biomas com grama azul / ciano / lilas (morros de "grama azul" relatados) viram biomas temperados verdes.
# O zc_world ainda mantem a temperatura temperada dentro da muralha (sem neve/gelo na cidade).
terralith:moonlight_grove > minecraft:forest
terralith:moonlight_valley > minecraft:plains
terralith:emerald_peaks > minecraft:stony_peaks
terralith:skylands_winter > terralith:skylands_summer
terralith:alpha_islands_winter > terralith:alpha_islands
terralith:mirage_isles > minecraft:forest
terralith:lavender_forest > minecraft:flower_forest
terralith:lavender_valley > minecraft:meadow
terralith:scarlet_mountains > minecraft:stony_peaks
