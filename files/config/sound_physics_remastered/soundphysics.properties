# ZomboidCraft defaults (Sound Physics Remastered 1.4.x). Missing keys are filled in by the mod.
# Stronger muffling through walls so you hear zombies "behind the door", slightly longer reverb in buildings.
max_occlusion=12.0
block_absorption=1.2
reverb_gain=1.1
simple_voice_chat_integration=true
simple_voice_chat_hear_self=false
# 0.4.5 (otimizacao): metade dos raios de reverberacao (padrao do mod: 32 raios, 4 quiques); a diferenca no som e minima.
environment_evaluation_ray_count=16
environment_evaluation_ray_bounces=3
